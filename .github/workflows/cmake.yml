name: CMake Build and Release

on:
  push:
    paths-ignore:
      - "docs/**"
      - "qmake/**"
      - "translations/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/.clang-*"
      - "**/.gitignore"
      - "**/*.pri"
      - "**/LICENSE*"
      - "**/*.pro"
      - "**/README*"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "qmake/**"
      - "translations/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/.clang-*"
      - "**/.gitignore"
      - "**/*.pri"
      - "**/LICENSE*"
      - "**/*.pro"
      - "**/README*"

env:
  MACOSX_DEPLOYMENT_TARGET: "14.4"
  RELEASES_DIR: packaging/releases

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
          - ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install dependencies
        uses: ./.github/actions/install-dependencies

      - name: Build and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: packaging\windows\package.ps1

      - name: Build and package (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          chmod +x packaging/macos/package.sh
          packaging/macos/package.sh

      - name: Build and package (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x packaging/ubuntu/package.sh
          packaging/ubuntu/package.sh

      - name: List release artifacts
        shell: bash
        run: |
          echo "=== ${{ matrix.os }} release files ==="
          ls -lh "${{ env.RELEASES_DIR }}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-package
          path: ${{ env.RELEASES_DIR }}

  # ============================================================
  # GitHub Release
  #   触发条件：push tag（refs/tags/*）
  #   依赖：build（三 OS 全部完成）
  #   流程：下载三份 artifact → 直接发布（文件名已由打包脚本写入版本与日期）
  # ============================================================
  github-release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare release directory
        shell: bash
        run: |
          mkdir -p "${{ env.RELEASES_DIR }}"

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: ${{ env.RELEASES_DIR }}

      - name: Flatten release artifacts
        working-directory: ${{ github.workspace }}/packaging
        shell: bash
        run: |
          chmod +x flatten_releases.sh
          ./flatten_releases.sh

      - name: Verify release contents
        shell: bash
        run: |
          echo "=== Release files ==="
          ls -lh "${{ env.RELEASES_DIR }}/"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ${{ env.RELEASES_DIR }}/*
