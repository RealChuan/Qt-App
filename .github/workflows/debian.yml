name: Build debian packages

on:
  push:
    paths-ignore:
      - "docs/**"
      - "qmake/**"
      - "translations/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/.clang-*"
      - "**/.gitignore"
      - "**/*.pri"
      - "**/LICENSE*"
      - "**/*.pro"
      - "**/README*"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "qmake/**"
      - "translations/**"
      - "**/*.md"
      - "**/*.txt"
      - "**/.clang-*"
      - "**/.gitignore"
      - "**/*.pri"
      - "**/LICENSE*"
      - "**/*.pro"
      - "**/README*"

env:
  RELEASES_DIR: ./packaging/releases

jobs:
  deb:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: ./.github/actions/install-dependencies

      - name: Install build dependencies
        run: |
          sudo apt update
          sudo apt install -y devscripts build-essential debhelper-compat equivs

      - name: Create output directories
        shell: bash
        run: |
          mkdir -p ${{ env.RELEASES_DIR }}

      - name: Generate Debian package
        shell: bash
        run: |
          ln --symbolic --no-dereference --force packaging/debian
          sudo mk-build-deps --install --remove
          chmod +x debian/package.sh
          export DPKG_GENSYMBOLS_CHECK_LEVEL=0
          export DEB_BUILD_OPTIONS=nocheck
          dpkg-buildpackage -b -us -uc -jauto

      - name: Collect artifacts
        shell: bash
        run: |
          # dpkg-buildpackage 的产物是 qt-app_<version>-<rev>_<arch>.deb，
          # 版本与架构本来就在文件名里，直接搬过来即可
          mv -v ../*.deb ${{ env.RELEASES_DIR }}/
          chmod -R +x ${{ env.RELEASES_DIR }}
          echo "=== debian package files ==="
          ls -lh ${{ env.RELEASES_DIR }}
          dpkg-deb -I ${{ env.RELEASES_DIR }}/*.deb control
          lintian -i ${{ env.RELEASES_DIR }}/*.deb || true

      - name: Upload Debian packages
        uses: actions/upload-artifact@v7
        with:
          name: debian-packages
          path: ${{ env.RELEASES_DIR }}
