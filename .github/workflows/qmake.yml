name: QMake Build

on:
  push:
    paths-ignore:
      - "cmake/**"
      - "docs/**"
      - "packaging/**"
      - "tests/**"
      - "translations/**"
      - "**/CMakeLists.txt"
      - "**/*.md"
      - "**/.clang-*"
      - "**/.gitignore"
      - "**/LICENSE*"
      - "vcpkg.json"
  pull_request:
    paths-ignore:
      - "cmake/**"
      - "docs/**"
      - "packaging/**"
      - "tests/**"
      - "translations/**"
      - "**/CMakeLists.txt"
      - "**/*.md"
      - "**/.clang-*"
      - "**/.gitignore"
      - "**/LICENSE*"
      - "vcpkg.json"

env:
  MACOSX_DEPLOYMENT_TARGET: "14.4"
  VCPKG_OSX_DEPLOYMENT_TARGET: "14.4"
  BUILD_DIR: build

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/install-dependencies

      - uses: RealChuan/setup-jom@main

      - name: Create build directory
        shell: bash
        run: mkdir -p ${{ env.BUILD_DIR }}

      - name: Build windows
        if: runner.os == 'Windows'
        working-directory: ${{ env.BUILD_DIR }}
        shell: pwsh
        run: |
          ..\packaging\windows\Enter-VsDevShell.ps1
          & qmake ..\.
          & jom

      - name: Build linux
        if: runner.os == 'Linux'
        working-directory: ${{ env.BUILD_DIR }}
        shell: bash
        run: |
          qmake ../.
          make -j $(nproc)

      # 一台机器连续编两个架构：依赖本来就按架构装了两套（x64-osx / arm64-osx），
      # 产物落在 binaries/qmake/<arch>/ 互不覆盖，但每个架构必须有自己的构建目录，
      # 否则 Makefile 与 .qmake.stash 会互相覆盖。
      - name: Build macos
        if: runner.os == 'macOS'
        shell: bash
        run: |
          for arch in x86_64 arm64; do
            mkdir -p "${BUILD_DIR}/macos-${arch}"
            (
              cd "${BUILD_DIR}/macos-${arch}"
              qmake QMAKE_APPLE_DEVICE_ARCHS="${arch}" ../../.
              make -j "$(sysctl -n hw.ncpu)"
            )
          done

      - name: Display binary directory tree (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd binaries/qmake/
          cmd /c tree /f

      - name: Display binary directory tree (Unix-like)
        if: runner.os == 'Linux' || runner.os == 'macOS'
        shell: bash
        run: |
          cd binaries/qmake/
          tree
